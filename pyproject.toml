[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sepetrum-tooldrift"
version = "0.1.0"
description = "比对工具描述与实际调用结果，标出描述与行为不符之处"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sepetrum" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sepetrum.github.io"
Repository = "https://github.com/sepetrum/tooldrift"
Issues = "https://github.com/sepetrum/tooldrift/issues"

[project.scripts]
tooldrift = "tooldrift:main"

[tool.setuptools]
py-modules = ["tooldrift"]
